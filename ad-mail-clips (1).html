<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>כל הקליפים והסרטונים ישירות למייל!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--page:#fff7a8;--page-ink:#1a0033;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#12002b;--page-ink:#fff7a8}}
:root[data-theme="dark"]{--page:#12002b;--page-ink:#fff7a8}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:"Rubik","Arial Hebrew",Arial,sans-serif;font-weight:900;background:var(--page);color:var(--page-ink);overflow-x:hidden}
.ticker{background:#000;color:#fff200;overflow:hidden;white-space:nowrap;border-block:4px solid #ff0080;font-size:1.25rem}
.ticker.b{background:#fff200;color:#000;border-color:#000}
.track{display:flex;width:max-content;animation:tick 22s linear infinite}
.track span{padding:.5rem 1.6rem}
@keyframes tick{to{transform:translateX(50%)}}
.hero{position:relative;overflow:hidden;isolation:isolate;padding:2rem 1rem 2.5rem;text-align:center}
.rays{position:absolute;inset:-100%;z-index:-1;background:repeating-conic-gradient(#ff0080 0 8deg,#ffe600 8deg 16deg,#00e5ff 16deg 24deg,#7c00ff 24deg 32deg);animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{line-height:1.02;font-size:clamp(2.7rem,11.5vw,6.8rem);text-shadow:-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,3px 3px 0 #000,0 9px 0 #000,0 0 28px #fff}
h1 span{display:block;animation:hue 1.8s linear infinite}
.l1{transform:rotate(-3deg)}
.l2{transform:rotate(2deg);animation-delay:-.6s!important}
.l3{animation:hue 1.2s steps(1) infinite,shake .5s ease-in-out infinite!important;animation-delay:-.3s}
@keyframes hue{0%{color:#fff200}25%{color:#00ffa3}50%{color:#ff9bf7}75%{color:#fff}100%{color:#fff200}}
@keyframes shake{0%,100%{transform:rotate(-1.5deg) translateX(0)}25%{transform:rotate(1.5deg) translateX(-6px)}75%{transform:rotate(-1deg) translateX(6px)}}
.shh{display:flex;align-items:center;justify-content:center;gap:.5rem;flex-wrap:wrap;margin:1.2rem 0 .5rem}
.emo{font-size:clamp(6rem,28vw,13rem);line-height:1;filter:drop-shadow(0 8px 0 #000);animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15) rotate(-6deg)}}
.bubble{position:relative;background:#fff;color:#ff0080;border:6px solid #000;border-radius:34px;padding:.4rem 1.2rem;font-size:clamp(2rem,9vw,4rem);letter-spacing:.06em;box-shadow:8px 8px 0 #000;transform:rotate(4deg);animation:wob 1.1s ease-in-out infinite}
.bubble::after{content:"";position:absolute;inset-inline-start:-34px;top:50%;border:20px solid transparent;border-inline-end-color:#000;transform:translateY(-50%)}
@keyframes wob{50%{transform:rotate(-4deg) scale(1.06)}}
.badges{display:flex;justify-content:center;flex-wrap:wrap;gap:.4rem;margin-top:1rem}
.star{width:132px;height:132px;display:grid;place-items:center;text-align:center;color:#000;font-size:1.25rem;line-height:1.05;clip-path:polygon(50% 0%,61% 15%,79% 9%,82% 28%,100% 35%,88% 50%,100% 65%,82% 72%,79% 91%,61% 85%,50% 100%,39% 85%,21% 91%,18% 72%,0% 65%,12% 50%,0% 35%,18% 28%,21% 9%,39% 15%);animation:wob 1.3s ease-in-out infinite}
.star:nth-child(1){background:#fff200}
.star:nth-child(2){background:#00ffa3;animation-delay:-.4s}
.star:nth-child(3){background:#ff9bf7;animation-delay:-.8s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1.1rem;max-width:920px;margin:2rem auto 0}
.card{border:5px solid #000;border-radius:18px;box-shadow:8px 8px 0 #000;padding:1rem .6rem;color:#000;font-size:1.35rem;line-height:1.15}
.card i{display:block;font-style:normal;font-size:3rem;margin-bottom:.3rem}
.card:nth-child(1){background:#fff200;transform:rotate(-2deg)}
.card:nth-child(2){background:#00e5ff;transform:rotate(2.5deg)}
.card:nth-child(3){background:#ff9bf7;transform:rotate(-1.5deg)}
.card:nth-child(4){background:#00ffa3;transform:rotate(2deg)}
.offer{position:relative;text-align:center;padding:2.5rem 1rem 3rem;background:repeating-linear-gradient(45deg,#000 0 22px,#2a0050 22px 44px);color:#fff}
.offer h2{font-size:clamp(2rem,8vw,4.2rem);line-height:1.05;color:#fff200;text-shadow:0 0 12px #ff0080,0 0 30px #ff0080,4px 4px 0 #ff0080}
.cd{display:inline-block;margin:1.2rem 0;padding:.3rem 1.2rem;background:#ff1a1a;border:5px solid #fff;border-radius:14px;font-size:clamp(1.4rem,6vw,2.4rem);animation:blink .8s steps(1) infinite}
@keyframes blink{50%{background:#fff200;color:#000}}
#cta{display:block;margin:.5rem auto 0;max-width:100%;cursor:pointer;font:inherit;font-size:clamp(1.5rem,6.5vw,2.8rem);color:#000;background:linear-gradient(90deg,#fff200,#00ffa3,#00e5ff,#ff9bf7,#fff200);background-size:300% 100%;border:6px solid #000;border-radius:60px;padding:.7rem 1.8rem;box-shadow:0 0 0 5px #fff200,10px 10px 0 5px #000;animation:cta 2s linear infinite,pulse2 .7s ease-in-out infinite}
#cta:focus-visible{outline:5px solid #fff;outline-offset:6px}
@keyframes cta{to{background-position:300% 0}}
@keyframes pulse2{50%{transform:scale(1.07)}}
.fine{padding:1rem;text-align:center;font-size:.9rem;font-weight:500}
#floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
#floaters span{position:absolute;left:var(--x);bottom:-4rem;font-size:var(--s);animation:rise var(--d) linear var(--w) infinite}
@keyframes rise{to{transform:translateY(-125vh) rotate(360deg)}}
.pop{position:fixed;font-size:2rem;pointer-events:none;z-index:20;animation:pop 1.1s ease-out forwards}
@keyframes pop{from{transform:translate(0,0) scale(.5)}to{transform:translate(var(--dx),var(--dy)) rotate(540deg) scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<div id="floaters" aria-hidden="true"></div>

<div class="ticker" aria-hidden="true"><div class="track"></div></div>

<header class="hero">
  <div class="rays" aria-hidden="true"></div>
  <h1><span class="l1">כל הקליפים</span><span class="l2">והסרטונים</span><span class="l3">ישירות למייל!!!</span></h1>
  <div class="shh">
    <span class="emo" role="img" aria-label="ששש">🤫</span>
    <div class="bubble">ששששששש!</div>
  </div>
  <div class="badges">
    <div class="star">חינם<br>!!!</div>
    <div class="star">רק<br>היום!</div>
    <div class="star">מבצע<br>ענק!!</div>
  </div>
  <div class="grid">
    <div class="card"><i>🎬</i>כל הקליפים</div>
    <div class="card"><i>📹</i>כל הסרטונים</div>
    <div class="card"><i>📧</i>ישר לתיבה</div>
    <div class="card"><i>⚡</i>בלי לחכות</div>
  </div>
</header>

<div class="ticker b" aria-hidden="true"><div class="track"></div></div>

<section class="offer">
  <h2>הכל. ישר. למייל.<br>ובשקט 🤫</h2>
  <div class="cd">⏰ המבצע נגמר בעוד <span id="cd">09:59</span></div>
  <button id="cta" type="button"><span>📧</span> <b>שלחו לי הכל למייל!</b></button>
</section>

<p class="fine">* ממש בשקט. ששששש… 🤫</p>

<script>
(function(){
  var em=['📧','🎬','📹','💥','⭐','🔥','🤫','✨','🎉','⚡'];
  var items=['🎬 כל הקליפים','📹 כל הסרטונים','📧 ישירות למייל','🤫 ששששש','💥 מבצע ענק','⚡ בלי לחכות','🔥 רק היום'];
  var html=items.map(function(t){return '<span>'+t+'</span>';}).join('');
  var half=html+html+html;
  document.querySelectorAll('.track').forEach(function(tr){tr.innerHTML=half+half;});

  var box=document.getElementById('floaters');
  for(var i=0;i<24;i++){
    var s=document.createElement('span');
    s.textContent=em[i%em.length];
    s.style.cssText='--x:'+(Math.random()*95)+'%;--s:'+(1.5+Math.random()*2.5)+'rem;--d:'+(6+Math.random()*8)+'s;--w:'+(-Math.random()*12)+'s';
    box.appendChild(s);
  }

  var t=599,cd=document.getElementById('cd');
  setInterval(function(){
    t=t<=0?599:t-1;
    cd.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
  },1000);

  var btn=document.getElementById('cta');
  btn.addEventListener('click',function(){
    var r=btn.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    for(var i=0;i<28;i++){
      var p=document.createElement('span');
      p.className='pop';
      p.textContent=em[i%em.length];
      p.style.cssText='left:'+cx+'px;top:'+cy+'px;--dx:'+(Math.random()*600-300)+'px;--dy:'+(Math.random()*600-400)+'px';
      document.body.appendChild(p);
      (function(el){setTimeout(function(){el.remove();},1200);})(p);
    }
    btn.querySelector('b').textContent='ששששש… נשלח בשקט!';
  });
})();
</script>
</body>
</html>
